<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="院内Webアプリと業務リンクをまとめて起動できるポータルサイト">
    <title>Clinic Web App Portal</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Clinic Portal</p>
          <h1>Webアプリ ポータル</h1>
          <p class="profile-label" id="profileLabel">共通トップページ</p>
        </div>
        <p class="header-note">英語・日本語どちらでも、入力するたびに候補を絞り込みます。Enterは不要です。</p>
      </div>
    </header>

    <main class="page-shell">
      <section class="search-toolbar" aria-label="アプリの検索">
        <label class="search-box" for="searchInput">
          <span>サイトを検索</span>
          <input id="searchInput" type="search" placeholder="例: enu / ato / vaccine / 夜尿" autocomplete="off" autofocus>
        </label>
        <p class="search-hint">表示名、説明、疾患名、英語キーワードを検索します。</p>
      </section>

      <div class="portal-layout">
        <nav class="group-nav" aria-label="疾患・業務">
          <h2>疾患・業務</h2>
          <div id="groupNav"></div>
        </nav>

        <div class="portal-results">
          <section class="summary-row" aria-live="polite">
            <p id="resultSummary">読み込み中...</p>
          </section>
          <section id="appSections" aria-label="サイト一覧"></section>
        </div>
      </div>

      <section class="empty-state" id="emptyState" hidden>
        <h2>該当するアプリがありません</h2>
        <p>検索語句やカテゴリを変更してください。</p>
      </section>

      <section class="error-state" id="errorState" hidden>
        <h2>アプリ一覧を読み込めませんでした</h2>
        <p>apps.json の形式や配置を確認してください。</p>
      </section>
    </main>

    <template id="appCardTemplate">
      <article class="app-card">
        <div class="card-body">
          <div class="card-topline">
            <span class="group-badge"></span>
            <span class="purpose-badge"></span>
            <span class="staff-badge" hidden>スタッフ</span>
            <span class="visibility-note" hidden>非表示</span>
          </div>
          <h2></h2>
          <p class="description"></p>
        </div>
        <a class="launch-button" target="_blank" rel="noopener noreferrer">開く</a>
      </article>
    </template>

    <script src="portal-config.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
