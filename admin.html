<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="院内ポータルに表示するURLを登録・並び替えする管理ツール">
    <title>Clinic Portal 管理ツール</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Clinic Portal Admin</p>
          <h1>リンク管理ツール</h1>
          <p class="profile-label">編集専用画面</p>
        </div>
        <p class="header-note">登録URLの追加、表示対象、並び順をまとめて調整できます。</p>
      </div>
    </header>

    <main class="page-shell admin-shell">
      <section class="admin-panel" aria-labelledby="gasTitle">
        <div class="admin-section-heading">
          <h2 id="gasTitle">Google Apps Script連携</h2>
          <p>最初に本番を読み込み、差分を確認してから保存します。保存前の内容は自動バックアップされます。</p>
        </div>

        <div class="admin-form">
          <label>
            <span>ウェブアプリURL</span>
            <input id="gasEndpointInput" type="url" placeholder="https://script.google.com/macros/s/.../exec">
          </label>

          <label>
            <span>管理用トークン</span>
            <input id="gasTokenInput" type="password" autocomplete="current-password" placeholder="Apps Scriptで設定したトークン">
          </label>

          <div class="form-actions">
            <button class="secondary-button" id="saveGasSettingsButton" type="button">接続設定を保存</button>
            <button class="secondary-button" id="loadFromGasButton" type="button">本番を再読み込み</button>
            <button class="primary-button" id="saveToGasButton" type="button" disabled>差分を確認して保存</button>
            <button class="secondary-button" id="restoreDraftButton" type="button" hidden>未反映の下書きを復元</button>
          </div>
        </div>
      </section>

      <section class="admin-panel" aria-labelledby="addAppTitle">
        <div class="admin-section-heading">
          <h2 id="addAppTitle">URL登録</h2>
          <p id="appFormHelp">URLを貼り付けて、表示名と対象トップページを選びます。</p>
        </div>

        <form class="admin-form" id="appForm">
          <input id="editIndexInput" type="hidden" value="">

          <label>
            <span>URL</span>
            <input id="urlInput" type="url" placeholder="https://example.com" required>
          </label>

          <label>
            <span>表示名</span>
            <input id="nameInput" type="text" placeholder="例: 受付用QR作成" required>
          </label>

          <label>
            <span>説明</span>
            <input id="descriptionInput" type="text" placeholder="スタッフに表示する説明">
          </label>

          <label>
            <span>疾患・業務グループ</span>
            <input id="groupInput" type="text" list="groupSuggestions" placeholder="例: 夜尿症" required>
            <datalist id="groupSuggestions"></datalist>
          </label>

          <label>
            <span>用途</span>
            <select id="purposeInput">
              <option>診察</option>
              <option>患者入口</option>
              <option>受付</option>
              <option>データ確認</option>
              <option>院内業務</option>
              <option>その他</option>
            </select>
          </label>

          <label>
            <span>検索キーワード</span>
            <input id="keywordsInput" type="text" placeholder="例: enuresis, enu, diary, おねしょ">
          </label>

          <label class="staff-visible-option">
            <input id="staffVisibleInput" type="checkbox">
            <span>スタッフページにも表示する（医師ページには常に表示されます）</span>
          </label>

          <div class="form-actions">
            <button class="primary-button" id="submitButton" type="submit">追加</button>
            <button class="secondary-button" id="cancelEditButton" type="button" hidden>編集をキャンセル</button>
          </div>
        </form>
      </section>

      <section class="admin-panel" aria-labelledby="orderTitle">
        <div class="admin-section-heading">
          <h2 id="orderTitle">並び替え</h2>
          <p>削除したリンクはゴミ箱に移動し、保存前・保存後とも復元できます。</p>
        </div>
        <div class="admin-list-toolbar">
          <button class="secondary-button compact-button is-active" id="showActiveButton" type="button">使用中</button>
          <button class="secondary-button compact-button" id="showTrashButton" type="button">ゴミ箱</button>
        </div>
        <div class="admin-list" id="adminList"></div>
      </section>

      <section class="admin-panel" aria-labelledby="exportTitle">
        <div class="admin-section-heading">
          <h2 id="exportTitle">反映用JSON</h2>
          <p>JSONは非常用の手元バックアップです。復元ファイルを選んでも、保存するまでは本番に反映されません。</p>
        </div>

        <div class="admin-actions">
          <button class="secondary-button" id="previewButton" type="button">トップページでプレビュー</button>
          <button class="secondary-button" id="copyButton" type="button">JSONをコピー</button>
          <button class="secondary-button" id="downloadButton" type="button">apps.jsonをダウンロード</button>
          <label class="secondary-button file-button">JSONから復元<input id="importInput" type="file" accept="application/json,.json" hidden></label>
          <button class="secondary-button" id="resetDraftButton" type="button">本番の内容に戻す</button>
        </div>

        <textarea class="json-output" id="jsonOutput" spellcheck="false" aria-label="apps.json の内容"></textarea>
        <p class="admin-status" id="adminStatus" role="status"></p>
      </section>
    </main>

    <script src="portal-config.js"></script>
    <script src="admin.js" defer></script>
  </body>
</html>
